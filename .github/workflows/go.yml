# Build, vet and test MicroGit across a matrix of Go versions and OSes.
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [ '1.21', '1.22', '1.23' ]
        # The macos-latest runner image (macOS 26) rejects binaries produced by
        # the Go 1.21/1.22 linkers (dyld: missing LC_UUID); test macOS on 1.23.
        exclude:
          - os: macos-latest
            go: '1.21'
          - os: macos-latest
            go: '1.22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -cover ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Test (race detector)
        run: go test -race ./...
