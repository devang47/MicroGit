# GoReleaser configuration — builds cross-platform binaries and publishes a
# GitHub release when a v* tag is pushed. See https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: microgit
    main: .
    binary: microgit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X microgit/cmd.version={{ .Version }}

archives:
  - id: microgit
    formats: [ tar.gz ]
    format_overrides:
      - goos: windows
        formats: [ zip ]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
